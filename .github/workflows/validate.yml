name: Validate sample packaging

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install software check dependencies
        run: python -m pip install -e './generator[test]' 'harbor==0.24.0'
      - name: Check the release and generate evidence
        run: python -m annals_challenge_harbor.checks --report work/ci-sample-checks.json
      - name: Upload software evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-checks
          path: |
            work/ci-sample-checks.json
            work/checks/
