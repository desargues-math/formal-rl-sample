name: Validate sample packaging

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install software check dependencies
        run: python -m pip install -e './generator[test]' 'harbor==0.24.0'
      - name: Check the release and generate evidence
        run: python -m annals_challenge_harbor.checks --report work/ci-sample-checks.json
      - name: Upload software evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-checks
          path: |
            work/ci-sample-checks.json
            work/checks/
